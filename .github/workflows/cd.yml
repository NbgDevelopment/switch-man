name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for GitVersioning

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Nerdbank.GitVersioning
        run: dotnet tool install -g nbgv

      - name: Get version
        id: nbgv
        run: |
          VERSION=$(nbgv get-version -v SemVer2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Prepare Docker image name
        id: docker
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repository=$REPO_LOWER" >> $GITHUB_OUTPUT
          echo "Docker repository: $REPO_LOWER"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.docker.outputs.repository }}:${{ steps.nbgv.outputs.version }}
            ghcr.io/${{ steps.docker.outputs.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate docker-compose.yml
        if: github.ref == 'refs/heads/main'
        run: |
          cat > docker-compose.yml <<EOF
          services:
            switchman:
              container_name: switchman
              image: ghcr.io/${{ steps.docker.outputs.repository }}:${{ steps.nbgv.outputs.version }}
              ports:
                - "18080:8080"
              restart: unless-stopped
              environment:
                - SwitchMan__ConfigPath=/data/config
                - SwitchMan__KeysPath=/data/keys
              volumes:
                - switchman_config:/data/config
                - switchman_keys:/data/keys
          volumes:
            switchman_config:
            switchman_keys:
          EOF

      - name: Create GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v${{ steps.nbgv.outputs.version }} > /dev/null 2>&1; then
            echo "Release v${{ steps.nbgv.outputs.version }} already exists, skipping."
          else
            gh release create v${{ steps.nbgv.outputs.version }} \
              --title "v${{ steps.nbgv.outputs.version }}" \
              --generate-notes \
              docker-compose.yml
          fi
